<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday - Wishing You All The Beautiful Things</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',sans-serif;
    background:#FEFCF8;
    overflow-x:hidden;
    color:#2a2a2a;
  }
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    padding:40px 20px;
  }
  .confetti-container{
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:10;
  }
  .confetti{
    position:absolute;
    width:10px;height:14px;
    top:-20px;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(-20px) rotate(0deg) translateX(0); opacity:1}
    100%{transform:translateY(110vh) rotate(720deg) translateX(100px); opacity:0.8}
  }
  h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(36px,6vw,68px);
    line-height:1.1;
    color:#1a1a1a;
    z-index:2;
    animation:fadeUp 1.2s ease;
  }
  .subtitle{
    margin-top:18px;
    font-size:18px;
    color:#6b5d4d;
    z-index:2;
    animation:fadeUp 1.2s ease 0.2s both;
  }
  .message-box{
    max-width:680px;
    margin-top:28px;
    background:rgba(255,255,255,0.9);
    border:1px solid #f0e6d3;
    border-radius:20px;
    padding:28px 32px;
    box-shadow:0 10px 40px rgba(0,0,0,0.05);
    z-index:2;
    animation:fadeUp 1.2s ease 0.4s both;
    line-height:1.8;
    font-size:16px;
  }
  .btns{
    margin-top:32px;
    display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
    z-index:2;
    animation:fadeUp 1.2s ease 0.6s both;
  }
  .btn{
    padding:14px 28px;
    border-radius:100px;
    border:none;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
  }
  .btn-primary{background:#C8A96A;color:white;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,169,106,0.4)}
  .btn-secondary{background:transparent;border:1.5px solid #C8A96A;color:#C8A96A;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)}}
  .wishes{
    padding:60px 20px;
    background:#FFFBF2;
    text-align:center;
  }
  .wishes h2{font-family:'Playfair Display';font-size:28px;margin-bottom:30px}
  .cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;max-width:900px;margin:0 auto}
  .card{
    background:white;
    padding:22px;
    border-radius:16px;
    width:260px;
    box-shadow:0 4px 20px rgba(0,0,0,0.04);
    border:1px solid #f5efe4;
    animation:floatCard 4s ease-in-out infinite;
  }
  .card:nth-child(2){animation-delay:0.5s}
  .card:nth-child(3){animation-delay:1s}
  @keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>

<div class="confetti-container" id="confetti"></div>

<div class="hero">
  <h1>Happy Birthday Neno <br>Wishing You All The<br>Beautiful Things</h1>
  <p class="subtitle">Today is princess November is birthday 18/11</p>
  
  

  <div class="btns">
    <button class="btn btn-secondary" onclick="celebrate()">click her</button>
  </div>
</div>


<script>
const colors = ['#C8A96A','#E8D5B5','#D4A5A5','#A8C3B9','#F2D0A7'];
const container = document.getElementById('confetti');
for(let i=0;i<70;i++){
  const el = document.createElement('div');
  el.className='confetti';
  el.style.left = Math.random()*100+'vw';
  el.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
  el.style.animationDuration = (4+Math.random()*6)+'s';
  el.style.animationDelay = Math.random()*5+'s';
  el.style.borderRadius = Math.random()>0.5?'2px':'50%';
  container.appendChild(el);
}
function celebrate(){
  for(let i=0;i<30;i++){
    const el = document.createElement('div');
    el.className='confetti';
    el.style.left = '50vw';
    el.style.top = '50vh';
    el.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = '2s';
    container.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
  alert('🎉 Happy birthday neno 🎉');
}
</script>
</body>
</html>
